      /* ==========================================================

         ========================================================== */
      (function () {
        var root = document.getElementById("sitemap-root");

        function escapeHtml(s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }

        function buildPageCard(page) {
          var thumbClass = "page-thumb" + (page.thumb ? " " + page.thumb : "");
          var tagClass =
            "page-tag" + (page.tagClass ? " " + page.tagClass : "");

          var tagHtml = page.tag
            ? '<span class="' +
              tagClass +
              '">' +
              escapeHtml(page.tag) +
              "</span>"
            : "";

          return (
            '<article class="page-card">' +
            '<div class="' +
            thumbClass +
            '">' +
            '<span class="thumb-icon"><i class="bi ' +
            escapeHtml(page.icon) +
            '"></i></span>' +
            tagHtml +
            "</div>" +
            '<div class="page-body">' +
            '<span class="page-file">' +
            escapeHtml(page.file) +
            "</span>" +
            "<h3>" +
            escapeHtml(page.title) +
            "</h3>" +
            "<p>" +
            escapeHtml(page.desc) +
            "</p>" +
            '<div class="page-actions">' +
            '<a href="' +
            escapeHtml(page.file) +
            '" class="btn btn-primary">' +
            '<i class="bi bi-box-arrow-up-right"></i>Buka' +
            "</a>" +
            "</div>" +
            "</div>" +
            "</article>"
          );
        }

        function buildSection(category) {
          var cards = category.pages.map(buildPageCard).join("");
          var count = category.pages.length;

          return (
            '<section class="index-category">' +
            '<div class="index-category-head">' +
            '<span class="cat-icon"><i class="bi ' +
            escapeHtml(category.icon) +
            '"></i></span>' +
            "<h2>" +
            escapeHtml(category.title) +
            "</h2>" +
            '<span class="cat-count">' +
            count +
            " halaman</span>" +
            "</div>" +
            '<div class="index-grid">' +
            cards +
            "</div>" +
            "</section>"
          );
        }

        root.innerHTML = SITEMAP.map(buildSection).join("");
